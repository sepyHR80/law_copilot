services:
  - type: web
    name: law-copilot
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: law-copilot-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: MINIO_ENDPOINT
        value: ""
      - key: MINIO_BUCKET_DOCUMENTS
        value: "law-copilot-documents"

databases:
  - name: law-copilot-db
    databaseName: law_copilot
    user: postgres
    plan: free
    postgresMajorVersion: "16"
