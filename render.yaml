services:
  - type: web
    name: law-copilot
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: MINIO_ENDPOINT
        value: ""
      - key: MINIO_BUCKET_DOCUMENTS
        value: "law-copilot-documents"

databases:
  - name: law-copilot-db
    databaseName: law_copilot
    user: postgres
    plan: free
    postgresMajorVersion: "16"
