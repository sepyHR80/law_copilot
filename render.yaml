services:
  - type: web
    name: law-copilot
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: law-copilot-db
          property: connectionString
      - key: EMBEDDING_ENDPOINT
        value: "https://generativelanguage.googleapis.com/v1beta/openai"
      - key: EMBEDDING_MODEL
        value: "gemini-embedding-001"
      - key: EMBEDDING_DIMENSION
        value: "1536"
      - key: EMBEDDING_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: "https://generativelanguage.googleapis.com/v1beta/openai"
      - key: LLM_MODEL
        value: "gemini-flash-latest"
      - key: LLM_API_KEY
        sync: false
      - key: RERANKER_ENABLED
        value: "false"
      - key: MINIO_ENDPOINT
        value: ""
      - key: MINIO_BUCKET_NAME
        value: "law-copilot-documents"

databases:
  - name: law-copilot-db
    databaseName: law_copilot
    user: postgres
    plan: free
    postgresMajorVersion: "16"
