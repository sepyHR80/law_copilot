[project]
name = "law-copilot"
version = "0.1.0"
description = "Production-like RAG and Agent platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.14.0",
    "fastapi>=0.141.1",
    "minio>=7.2.20",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "PyMuPDF>=1.28.0",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
    "openai>=1.0.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pyright>=1.1.400",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
